[package]
name = "be-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
be-doc = { path = "../be-doc" }
be-input = { path = "../be-input" }
be-config = { path = "../be-config" }
be-task = { path = "../be-task" }
be-lsp = { path = "../be-lsp" }
be-git = { path = "../be-git" }

libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.26.13"
unicode-segmentation = "1.13.3"
log = "0.4.34"
be-macros = { version = "0.1.0", path = "../be-macros" }
be-shared = { version = "0.1.0", path = "../be-shared" }

[dev-dependencies]
expect-test.workspace = true
