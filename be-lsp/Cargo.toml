[package]
name = "be-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
be-async = { path = "../be-async" }
be-doc = { path = "../be-doc" }
be-task = { path = "../be-task" }
be-config = { path = "../be-config" }
crossbeam-channel = "0.5.17"
libc = "0.2.190"
log = "0.4.34"

lsp = { version = "0.1.1", features = ["raw_value"] }
parking_lot = "0.12.5"
polling = "3.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
