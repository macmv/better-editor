[package]
name = "be-gui"
version = "0.1.0"
edition = "2024"
default-run = "be-gui"

[dependencies]
kurbo = "0.13"
parley = "0.12.0"
peniko = "0.6"
pollster = "0.4.0"
vello = "0.11.0"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false, features = ["wayland", "x11", "rwh_06"] }
skrifa = { version = "0.44", default-features = false }

be-doc = { path = "../be-doc" }
be-macros = { path = "../be-macros" }
be-shared = { version = "0.1.0", path = "../be-shared" }
be-config = { path = "../be-config" }
be-input = { path = "../be-input" }
be-lsp = { path = "../be-lsp" }
be-editor = { path = "../be-editor" }
be-terminal = { path = "../be-terminal" }
be-shell = { path = "../be-shell" }
be-animation = { path = "../be-animation" }
be-workspace = { path = "../be-workspace" }
be-remote = { path = "../be-remote" }
lode-local = { version = "*" }
lode-poll = { version = "*" }

bytemuck = "1.25.2"
png = { version = "0.17", default-features = false }
fern = { version = "0.7.1", features = ["chrono"] }
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false }
unicode-segmentation = "1.13.3"

puffin = "0.19.1"
puffin_http = "0.16.1"
nucleo = "0.5.0"
ignore = "0.4.33"
smol_str = "0.3.6"
be-git = { version = "0.1.0", path = "../be-git" }
be-fs = { version = "0.1.0", path = "../be-fs" }
be-task = { path = "../be-task" }
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = { version = "0.7.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[build-dependencies]
be-icon-importer = { version = "0.1.0", path = "../be-icon-importer" }

[dev-dependencies]
expect-test.workspace = true
