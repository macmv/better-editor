[package]
name = "be-sumtree-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.be-sumtree]
path = ".."
features = ["fuzz", "small-nodes"]

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false
bench = false
