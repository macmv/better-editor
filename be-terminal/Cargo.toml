[package]
name = "be-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
anstyle-parse = "0.2.7"
bitflags = "2.13.2"
libc = "0.2.190"
log = "0.4.34"
polling = "3.11.0"
rustix = { version = "1.1.5", features = ["std"] }
rustix-openpty = "0.2.0"
unicode-width = "0.2.2"

be-async = { version = "0.1.0", path = "../be-async" }
be-macros = { path = "../be-macros" }

[dev-dependencies]
expect-test.workspace = true
